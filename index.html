<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Incendie personnalisé</title><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#222}.wrap{max-width:850px;margin:auto;padding:25px}.card{background:white;border-radius:16px;padding:22px;margin-top:18px}button{padding:13px 18px;margin:7px;border:0;border-radius:10px;background:#b52222;color:white;font-weight:bold;cursor:pointer}.choice{display:block;width:100%;text-align:left;background:white;color:#222;border:2px solid #ddd}.correct{border-color:#187a3d!important;background:#edf8f0!important}.wrong{border-color:#b52222!important;background:#fdecec!important}.hidden{display:none}.bar{height:8px;background:#ddd}.bar span{display:block;height:100%;background:#b52222}</style><style>
.score{text-align:center;font-size:2.4em;font-weight:bold;margin:22px 0;color:#b52222}
.score-message{background:#f8f8f8;border-left:5px solid #b52222;padding:16px;border-radius:8px;line-height:1.5}
.waiting{text-align:center;margin:22px auto;padding:18px;border-radius:14px;background:#fff4f0;border:1px solid #e4c0b5}
.fire-scene{position:relative;height:145px;overflow:hidden;border-radius:12px;background:linear-gradient(#292929,#111);margin:15px 0}
.flame{position:absolute;bottom:16px;left:50%;width:48px;height:76px;background:#e64a19;border-radius:50% 50% 45% 45%;transform:translateX(-50%) rotate(45deg);animation:flicker .7s infinite alternate}
.flame:after{content:"";position:absolute;width:25px;height:45px;background:#ffb347;border-radius:50% 50% 45% 45%;left:10px;top:20px}
.ember{position:absolute;bottom:42px;width:6px;height:6px;border-radius:50%;background:#ffb347;animation:rise 3s infinite ease-in}
.e1{left:35%;animation-delay:.2s}.e2{left:45%;animation-delay:1s}.e3{left:58%;animation-delay:1.7s}.e4{left:68%;animation-delay:.7s}
@keyframes flicker{from{transform:translateX(-50%) rotate(42deg) scale(.95)}to{transform:translateX(-50%) rotate(48deg) scale(1.08)}}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(.2)}}
</style><style>50%{transform:translateX(10px)}}50%{transform:rotate(-4deg)}}to{transform:scale(1.08)}}</style><style>.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}.confetti i{position:absolute;left:50%;top:42%;width:9px;height:14px;background:#b52222;animation:confettiFall var(--d) ease-out var(--delay) forwards;transform:rotate(var(--r))}.confetti i:nth-child(3n){background:#187a3d}.confetti i:nth-child(3n+1){background:#f2b134}.confetti i:nth-child(4n){background:#2878c8}@keyframes confettiFall{0%{opacity:1;transform:translate(0,0) rotate(0deg)}100%{opacity:0;transform:translate(var(--x),85vh) rotate(720deg)}}</style><style>
.professional-waiting{background:#f8fafb!important;border:1px solid #d8dee3!important;text-align:left!important;padding:20px;border-radius:14px;margin-top:22px}
.professional-waiting h3{text-align:center;margin:0;font-size:1.35em}
.waiting-line{height:3px;width:60px;background:#b52222;border-radius:3px;margin:14px auto 22px}
.waiting-main{line-height:1.55;margin:18px 0}
.course-status{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e1e5e8;border-radius:10px;padding:14px;margin-top:18px}
.course-status span{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#edf8f0;color:#187a3d;font-weight:bold;font-size:17px;flex:none}
.course-status small{display:block;color:#666;margin-top:3px}
</style></head><body><div class="wrap"><h1>🚒 Quiz Équipier Intervention Incendie</h1><div id="app" class="card"></div></div><script>const questions=[{"theme":"Prévention","q":"Vous constatez qu'une porte coupe-feu normalement maintenue fermée reste ouverte en permanence par une cale. Quelle analyse est la plus pertinente ?","choices":["Elle facilite l'évacuation, donc ce n'est pas un problème.","Elle peut compromettre le compartimentage ; il faut signaler/corriger la situation.","Elle ne pose problème que lorsque l'alarme est déclenchée.","Il faut la fermer à clé pour éviter qu'elle reste ouverte."],"correct":1,"exp":"Le compartimentage participe à limiter la propagation du feu et/ou des fumées. Il faut respecter le fonctionnement prévu du dispositif et les consignes du site.","prompts":[],"takeaway":""},{"theme":"ERP / dégagements","q":"Lors d'une ronde, vous trouvez un chariot de livraison qui réduit fortement la largeur utile d'un dégagement. Le départ de feu n'est pas avéré. Que faites-vous ?","choices":["Rien : ce n'est dangereux qu'en cas d'incendie.","Vous le laissez jusqu'à la prochaine livraison.","Vous faites supprimer l'obstacle.","Vous placez un extincteur devant pour le signaler."],"correct":2,"exp":"La prévention se fait avant le sinistre : un dégagement encombré peut gêner la circulation et l'évacuation. La situation doit être traitée conformément aux procédures du site.","prompts":[],"takeaway":""},{"theme":"SSI / détection","q":"Un détecteur automatique signale un événement sur le système de sécurité incendie. Quelle affirmation est la plus juste ?","choices":["Le détecteur éteint automatiquement le feu.","Le signal dispense l'équipe de vérifier et d'appliquer les consignes.","Le signal signifie forcément qu'il y a un incendie confirmé.","Le signal peut déclencher, selon la configuration, une chaîne de mise en sécurité et/ou d'alarme."],"correct":3,"exp":"Un déclenchement de détection est un signal à traiter selon l'organisation. Il ne faut pas confondre détection, confirmation du sinistre et extinction.","prompts":[],"takeaway":""},{"theme":"SSI / alarme","q":"Un déclencheur manuel est actionné. Vous êtes équipier désigné. Quelle réaction est la plus adaptée ?","choices":["Réinitialiser immédiatement le système pour éviter de déranger les occupants.","Appliquer la procédure prévue : traitement de l'alarme, alerte et mise en sécurité selon votre rôle.","Attendre de voir si quelqu'un appelle les secours.","Chercher l'auteur du déclenchement avant toute autre action."],"correct":1,"exp":"Le déclenchement doit être pris au sérieux et traité selon la procédure du site. La remise en service d'un système ne doit pas être improvisée."},{"theme":"Désenfumage","q":"Un désenfumage se déclenche pendant un incendie. Quelle proposition décrit le mieux son intérêt ?","choices":["Il participe à maintenir des conditions plus favorables à l'évacuation et à l'intervention dans les zones concernées.","Il garantit l'absence de fumée dans tout le bâtiment.","Il remplace l'évacuation.","Il refroidit automatiquement toutes les structures."],"correct":0,"exp":"Le désenfumage vise notamment à limiter les effets des fumées dans les zones prévues. Son efficacité et son fonctionnement dépendent de l'installation.","prompts":[],"takeaway":""},{"theme":"Alerte","q":"Vous appelez les secours depuis un ERP. Quelle combinaison d'informations est prioritaire ?","choices":["Votre nom et votre service uniquement.","Uniquement le nombre de personnes évacuées.","Adresse/localisation, nature du sinistre, situation connue.","Uniquement le type d'extincteur utilisé."],"correct":2,"exp":"La localisation précise et la nature de l'événement sont essentielles. Il faut ensuite répondre aux questions de l'opérateur et suivre les consignes données.","prompts":[],"takeaway":""},{"theme":"Alerte / transmission","q":"Vous voyez un début de feu mais une autre personne vous dit : « J'ai déjà prévenu quelqu'un ». Quelle conduite est la plus prudente ?","choices":["Considérer automatiquement que l'alerte est faite.","S'assurer que l'alerte a bien été transmise par le canal prévu.","Ne rien faire et attendre.","Quitter les lieux sans appliquer les consignes."],"correct":1,"exp":"Une information supposée transmise n'est pas forcément une alerte effectivement reçue. Il faut appliquer la procédure de transmission du site.","prompts":[],"takeaway":""},{"theme":"Évacuation","q":"L'alarme retentit. Une personne vous demande si elle peut retourner chercher son téléphone. Que faites-vous ?","choices":["Vous l'accompagnez pour gagner du temps.","Vous lui demandez d'attendre la fin de l'alarme.","Vous coupez l'alarme le temps qu'elle le récupère.","Vous lui demandez de ne pas retarder sa mise en sécurité et de suivre les consignes d'évacuation."],"correct":3,"exp":"Les biens personnels ne doivent pas retarder la mise en sécurité. L'équipier rappelle calmement les consignes et contribue à l'évacuation.","prompts":[],"takeaway":""},{"theme":"Évacuation / fumées","q":"Vous devez emprunter un chemin d'évacuation mais vous constatez qu'il est fortement enfumé. Quelle décision est la plus adaptée ?","choices":["Traverser rapidement quoi qu'il arrive.","Suivre le chemin alternatif prévu ou appliquer les consignes de mise en sécurité ; ne pas s'exposer inutilement.","Ramper systématiquement sous la fumée.","Ouvrir toutes les portes pour ventiler."],"correct":1,"exp":"Les fumées peuvent être toxiques et très chaudes. On ne s'engage pas dans une zone dangereuse sans les conditions, moyens et consignes appropriés."},{"theme":"Mise en sécurité","q":"Une personne ne peut pas suivre facilement le flux d'évacuation. Quelle est la meilleure approche ?","choices":["La laisser seule pour ne pas ralentir le groupe.","La porter systématiquement, quelle que soit la situation.","Appliquer le dispositif prévu par l'établissement pour sa mise en sécurité et son accompagnement.","La placer dans n'importe quel local fermé."],"correct":2,"exp":"La conduite dépend du bâtiment, des procédures et de la situation de la personne. Le but est de la mettre en sécurité sans exposer l'équipier à un risque disproportionné.","prompts":[],"takeaway":""},{"theme":"Point de rassemblement","q":"Au point de rassemblement, une personne affirme qu'un collègue manque à l'appel. Quelle réaction est la plus appropriée ?","choices":["Retourner immédiatement seul dans le bâtiment.","Ignorer l'information tant que les pompiers ne sont pas là.","Demander à un collègue non formé de retourner chercher la personne.","Transmettre l'information à la personne désignée et ne pas retourner dans le bâtiment sans consigne."],"correct":3,"exp":"Une personne manquante est une information importante à transmettre. La recherche dans le bâtiment relève des personnels et secours compétents, selon les circonstances.","prompts":[],"takeaway":""},{"theme":"Extincteur / choix","q":"Un départ de feu concerne une installation électrique sous tension. Quel principe guide le choix de l'extincteur ?","choices":["Prendre l'extincteur le plus proche.","Utiliser un agent extincteur compatible avec le risque électrique.","Utiliser systématiquement de l'eau.","Utiliser uniquement une couverture."],"correct":1,"exp":"Le choix dépend du risque et de l'appareil. Pour l'électrique, un extincteur approprié, par exemple CO₂ dans les situations prévues, peut être utilisé en respectant les précautions.","prompts":[],"takeaway":""},{"theme":"Extincteur / engagement","q":"Vous avez un extincteur adapté, mais la fumée est dense et votre voie de repli risque d'être coupée. Que faites-vous ?","choices":["Vous intervenez puisque vous avez l'extincteur adapté.","Vous entrez plus loin pour être plus efficace.","Vous renoncez à l'engagement.","Vous demandez à une personne non formée de vous accompagner."],"correct":2,"exp":"Avoir un extincteur ne signifie pas que l'intervention est sûre. La fumée, l'ampleur du feu et l'absence de repli peuvent rendre l'engagement inadapté.","prompts":[],"takeaway":""},{"theme":"Fumées / porte","q":"Vous trouvez une porte chaude au toucher avec de la fumée visible autour. Quelle attitude est la plus prudente ?","choices":["Ouvrir brutalement pour identifier le feu.","Éviter l'ouverture improvisée, donner l'alerte et appliquer les consignes adaptées.","Entrer immédiatement avec un extincteur.","Ouvrir pour évacuer les fumées."],"correct":1,"exp":"Une porte chaude et la présence de fumées peuvent indiquer une situation dangereuse. Une ouverture non maîtrisée peut aggraver l'exposition au feu et aux fumées."},{"theme":"Organisation / rôles","q":"Pourquoi un équipier doit-il connaître son rôle avant le déclenchement d'un incendie ?","choices":["Pour éviter de recevoir des ordres.","Pour décider seul des procédures d'évacuation.","Pour pouvoir remplacer les pompiers.","Pour agir rapidement et de façon coordonnée lorsque l'alarme ou l'alerte survient."],"correct":3,"exp":"La préparation permet de réduire l'improvisation : qui alerte, qui guide, qui vérifie certaines zones, qui accueille les secours, etc., selon l'organisation du site.","prompts":[],"takeaway":""},{"theme":"Question piège","q":"Quelle affirmation est la plus juste concernant une alarme incendie ?","choices":["Une alarme est forcément une fausse alerte si aucun feu n'est visible.","Une alarme doit être traitée selon les consignes prévues ; l'absence de flammes visibles ne permet pas de conclure qu'il n'y a aucun danger.","Il faut toujours couper l'alarme avant d'évacuer.","Seul le responsable de sécurité doit réagir."],"correct":1,"exp":"Une alarme peut correspondre à différents événements et doit être traitée selon la procédure. Une absence de flammes visibles ne suffit pas à écarter un danger."},{"theme":"Cas pratique","q":"Vous êtes au rez-de-chaussée. L'alarme retentit, une odeur de fumée apparaît dans un couloir et plusieurs personnes commencent à sortir. Quelle priorité correspond le mieux à votre rôle ?","choices":["Appliquer votre mission prévue : alerte/transmission, mise en sécurité ou évacuation selon les consignes, et intervention seulement si les conditions sont sûres.","Chercher seul la source exacte avant d'agir.","Fermer toutes les portes à clé.","Rester sur place jusqu'à ce que quelqu'un vous dise quoi faire."],"correct":0,"exp":"L'équipier agit dans le cadre de son rôle et des procédures du site. La sécurité prime sur la recherche du sinistre ou une intervention improvisée.","prompts":[],"takeaway":""},{"theme":"🏆 Mission finale","q":"MISSION FINALE — Vous êtes équipier dans un ERP. Une détection déclenche l'alarme. Une porte coupe-feu d'une zone concernée est ouverte, de la fumée est visible dans un dégagement et une personne indique qu'elle n'a pas pu évacuer. Quelle réponse est la plus cohérente ?","choices":["Entrer seul dans la zone enfumée, fermer la porte et rechercher la personne.","Donner/transmettre l'alerte, appliquer les consignes de mise en sécurité/évacuation, signaler la situation aux responsables/secours et ne pas s'exposer à un risque non maîtrisé.","Réinitialiser le SSI puis vérifier si l'alarme revient.","Demander aux personnes évacuées de retourner chercher la personne."],"correct":1,"exp":"Plusieurs événements se cumulent. L'équipier doit coordonner les actions prévues : alerte, mise en sécurité, transmission d'informations et protection des personnes, sans s'engager dans une zone dangereuse sans les conditions requises."}];let i=0,score=0;function render(){let q=questions[i],a=document.getElementById('app');a.innerHTML='<small>Question '+(i+1)+' / '+questions.length+'</small><h2>'+q.q+'</h2>'+q.choices.map((x,n)=>'<button class="choice" onclick="answer('+n+')">'+String.fromCharCode(65+n)+'. '+x+'</button>').join('')+'<div id="f" class="hidden"></div>'}function answer(n){let q=questions[i],bs=document.querySelectorAll('.choice');bs.forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');if(k===n&&n!==q.correct)b.classList.add('wrong')});if(n===q.correct){score++;confetti()}document.getElementById('f').classList.remove('hidden');document.getElementById('f').innerHTML='<p><strong>Explication :</strong> '+q.exp+'</p><button onclick="next()">Question suivante →</button>'}function confetti(){let c=document.createElement('div');c.className='confetti';c.innerHTML=Array.from({length:32},(_,n)=>'<i style="--x:'+((Math.random()*100)-50)+'vw;--r:'+Math.round(Math.random()*360)+'deg;--d:'+(0.6+Math.random()*0.8)+'s;--delay:'+(Math.random()*0.2)+'s"></i>').join('');document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}function next(){if(i<questions.length-1){i++;render()}else{showResult()}} function showResult(){let total=questions.length,pct=Math.round(score/total*100),message; if(pct<50){message='Quelques notions sont encore à revoir. Pas d’inquiétude : ce questionnaire sert justement à faire le point avant le cours.'} else if(pct<80){message='Les bases sont là ! Le cours permettra de consolider les bons réflexes et les points à approfondir.'} else{message='Très bon résultat ! Le cours permettra maintenant d’aller plus loin et de consolider vos réflexes.'} document.getElementById('app').innerHTML='<h2>🏆 Quiz terminé !</h2><div class="score">'+score+' / '+total+'<br><strong>'+pct+' % de réussite</strong></div><div class="score-message"><p><strong>'+message+'</strong></p><p>Merci pour votre participation !</p></div><div class="waiting"><h2>🔥 En attendant le cours…</h2><p>Le formateur va bientôt commencer. Vous pouvez maintenant quitter cette page.</p><div class="professional-waiting"><h3>📚 Prochaine étape</h3><div class="waiting-line"></div><p><strong>Le questionnaire est terminé.</strong></p><p>Merci pour votre participation.</p><p class="waiting-main">La suite de la formation se fera avec votre formateur.</p><div class="course-status"><span>✓</span><div><strong>Vous pouvez maintenant quitter cette page</strong></div></div></div><p><strong>Le cours va bientôt commencer.</strong></p></div><button onclick="i=0;score=0;render()">Recommencer le questionnaire</button>'} render();</script></body></html>
